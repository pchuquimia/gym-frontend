name: Frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: http://127.0.0.1:4000
      VITE_PUBLIC_DEMO: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "npm@$(node -p 'require("./package.json").engines.npm')"
      - name: Verify the declared toolchain
        run: |
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.versions.node, require("./package.json").engines.node)'
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:progress
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:playwright -- authentication.spec.js account-onboarding.spec.js progress-dashboard.spec.js nutrition.spec.js coach-messages.spec.js --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
