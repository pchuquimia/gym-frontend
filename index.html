<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Language" content="es" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/rirfit-mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/rirfit-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="RIRFIT" />
    <meta name="apple-mobile-web-app-title" content="RIRFIT" />
    <meta
      name="description"
      content="RIRFIT convierte cada entrenamiento en progreso medible. Planifica, registra y mejora con intención."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RIRFIT" />
    <meta property="og:title" content="RIRFIT | Entrena con intención" />
    <meta property="og:url" content="https://rirfit.com" />
    <link rel="canonical" href="https://rirfit.com" />
    <meta
      property="og:description"
      content="Entrenamiento, progreso y coaching guiados por datos."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const storageKey = "theme";
        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
        document.documentElement.dataset.displayMode = isStandalone
          ? "standalone"
          : "browser";
        const stored = localStorage.getItem(storageKey);
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme = stored || (prefersDark ? "dark" : "light");
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.dataset.theme = theme;
        const themeColor = theme === "dark" ? "#090909" : "#faf8f1";
        document.documentElement.style.backgroundColor = themeColor;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", themeColor);
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute(
            "content",
            theme === "dark" ? "black-translucent" : "default",
          );
      })();
    </script>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf8f1;
        color: #171713;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }

      .dark #app-boot {
        background: #090909;
        color: #f4f1e9;
      }

      .app-boot__content {
        width: min(320px, 100%);
      }

      .app-boot__mark {
        display: flex;
        width: 58px;
        height: 58px;
        margin: 0 auto 18px;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
        padding: 15px;
        box-sizing: border-box;
        border-radius: 50%;
        background: #171713;
      }

      .dark .app-boot__mark {
        background: #f4f1e9;
      }

      .app-boot__mark i {
        display: block;
        width: 5px;
        border-radius: 999px;
        background: #fff;
        animation: app-boot-pulse 1.1s ease-in-out infinite;
      }

      .dark .app-boot__mark i {
        background: #171713;
      }

      .app-boot__mark i:nth-child(1) {
        height: 10px;
      }

      .app-boot__mark i:nth-child(2) {
        height: 18px;
        animation-delay: 0.14s;
      }

      .app-boot__mark i:nth-child(3) {
        height: 27px;
        animation-delay: 0.28s;
      }

      #app-boot h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      #app-boot p {
        margin: 8px auto 0;
        color: #6f6a61;
        font-size: 13px;
        line-height: 1.45;
      }

      .dark #app-boot p {
        color: #aaa69d;
      }

      #app-boot-retry {
        width: 100%;
        min-height: 46px;
        margin-top: 20px;
        border: 0;
        border-radius: 999px;
        background: #171713;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .dark #app-boot-retry {
        background: #f4f1e9;
        color: #171713;
      }

      @keyframes app-boot-pulse {
        0%,
        100% {
          transform: scaleY(0.55);
          opacity: 0.55;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot__mark i {
          animation: none;
        }
      }
    </style>
    <title>RIRFIT | Entrena con intención</title>
  </head>
  <body class="notranslate">
    <div id="root">
      <main id="app-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="app-boot__content">
          <span class="app-boot__mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <h1 id="app-boot-title">Preparando RIRFIT</h1>
          <p id="app-boot-copy">Cargando tu espacio de entrenamiento.</p>
          <button id="app-boot-retry" type="button" hidden>
            Volver a intentar
          </button>
        </div>
      </main>
    </div>
    <script>
      (() => {
        const boot = document.getElementById("app-boot");
        const retry = document.getElementById("app-boot-retry");
        const retryKey = "rirfit_boot_reload_attempt";
        const reloadQueryKey = "__rirfit_reload";
        let timeoutId;

        const reloadFresh = () => {
          const url = new URL(window.location.href);
          url.searchParams.set(reloadQueryKey, String(Date.now()));
          window.location.replace(url.toString());
        };

        const finishBoot = () => {
          window.clearTimeout(timeoutId);
          try {
            sessionStorage.removeItem(retryKey);
          } catch {
            // The application can start without session storage.
          }
        };

        window.addEventListener("rirfit:boot-ready", finishBoot, {
          once: true,
        });

        retry.addEventListener("click", reloadFresh);

        timeoutId = window.setTimeout(() => {
          if (window.__RIRFIT_BOOT_READY__ || !boot?.isConnected) return;

          let alreadyRetried = false;
          try {
            alreadyRetried = sessionStorage.getItem(retryKey) === "true";
          } catch {
            // Fall through to the visible recovery action.
          }

          if (!alreadyRetried) {
            try {
              sessionStorage.setItem(retryKey, "true");
            } catch {
              // Reload once even when storage is restricted.
            }
            reloadFresh();
            return;
          }

          document.getElementById("app-boot-title").textContent =
            "La carga está tardando más de lo esperado";
          document.getElementById("app-boot-copy").textContent =
            "Comprueba tu conexión y vuelve a intentarlo.";
          retry.hidden = false;
          boot.setAttribute("aria-busy", "false");
        }, 10_000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
